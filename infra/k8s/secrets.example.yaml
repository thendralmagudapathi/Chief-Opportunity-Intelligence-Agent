apiVersion: v1
kind: Secret
metadata:
  name: oia-secrets
  namespace: oia
type: Opaque
stringData:
  SECURITY__SECRET_KEY: replace-me-with-a-long-random-secret
  DATABASE__URL: postgresql+asyncpg://oia:replace-me@postgres:5432/oia
  REDIS__URL: redis://redis:6379/0
  WORKERS__BROKER_URL: redis://redis:6379/1
  WORKERS__RESULT_BACKEND: redis://redis:6379/2
  MODELS__API_KEY: replace-me
  MODELS__BASE_URL: http://vllm:8000
