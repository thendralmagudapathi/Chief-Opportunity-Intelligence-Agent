apiVersion: apps/v1
kind: Deployment
metadata:
  name: oia-api
  namespace: oia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oia-api
  template:
    metadata:
      labels:
        app: oia-api
    spec:
      containers:
        - name: api
          image: oia-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oia-config
            - secretRef:
                name: oia-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oia-api
  namespace: oia
spec:
  selector:
    app: oia-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oia-api
  namespace: oia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oia-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
