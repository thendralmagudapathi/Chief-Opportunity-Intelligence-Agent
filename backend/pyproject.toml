[project]
name = "oia-backend"
version = "0.1.0"
description = "Opportunity Intelligence Agent — autonomous opportunity discovery, evaluation and recommendation platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# Phase 1 runtime dependencies only. Later phases are optional extras so the
# foundation installs fast and CI stays cheap (see docs/IMPLEMENTATION_PLAN.md).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "redis>=5.2",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
]
rag = [
    "llama-index-core>=0.12",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
]
mcp = ["mcp>=1.1"]
observability = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "langfuse>=2.53",
]
evaluation = ["ragas>=0.2", "mlflow>=2.18", "scikit-learn>=1.5"]
workers = ["celery[redis]>=5.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "oia-backend[agents]",
    # ruff covers linting and formatting; a second formatter would only add a
    # way for the two to disagree.
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "ASYNC",     # async correctness
    "S",         # bandit
    "T20",       # no print
    "SIM",       # simplify
    "RUF",
]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the framework idiom
    "S104",   # binding 0.0.0.0 is intentional inside containers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]          # asserts and test credentials
"app/db/migrations/*" = ["E501", "I001"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false        # FastAPI/SQLAlchemy decorators
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "argon2.*", "pypdf.*", "docx.*", "sentence_transformers.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL instance",
    "smoke: minimal end-to-end path",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
